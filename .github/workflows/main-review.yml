name: Main review
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
# Do not cancel a review already publishing findings. Each CI run has its own group.
concurrency:
  group: main-review-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  review:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Run the trusted default-branch monitor; never install/execute the reviewed diff.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Report CI failures and review merged changes
        env:
          GH_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/review/main-review.mjs
