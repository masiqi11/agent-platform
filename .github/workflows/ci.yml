name: ci
on:
  pull_request:
  push: { branches: [main] }
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: agent, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: agent_platform_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://agent:ci-only@127.0.0.1:5432/agent_platform_test
      DATABASE_URL: postgres://agent:ci-only@127.0.0.1:5432/agent_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - run: bun install --frozen-lockfile
      # §14.5 dependency audit: fails the build on known vulnerabilities in locked dependencies.
      - name: test main-review monitor
        run: node --test scripts/review/*.test.mjs
      # GHSA-fc5q-39xc-vjpf (picomatch <=4.0.7, ReDoS via crafted extglobs) has no fixed release yet
      # (latest is 4.0.7). picomatch is reached only through vite -> tinyglobby at BUILD time with the
      # project's own fixed glob patterns — never in the server, never with user input. Ignored on the
      # maintainer's decision (PR #14); remove the --ignore as soon as a fixed picomatch is published.
      - run: bun audit --ignore GHSA-fc5q-39xc-vjpf
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - name: migration drift check (generated SQL must match schema)
        run: cd apps/server && bun x drizzle-kit generate --name drift-check | tee /tmp/drift.txt && grep -q "No schema changes" /tmp/drift.txt
      - run: bun run test
      - run: bun run build
      - name: front-end budget (§13.10)
        run: bun scripts/check-web-budget.ts
      - name: e2e (Playwright, scripted model)
        run: cd apps/web && bun x playwright install --with-deps chromium && bun x --no-install playwright test
  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-platform:ci .
