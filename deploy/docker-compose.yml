# Production-style stack: postgres + one-shot migrate + app (§7.3). Secrets come from deploy/.env.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent}"]
      interval: 5s
      retries: 20
  migrate:
    build: { context: .., dockerfile: Dockerfile }
    command: ["bun", "apps/server/src/cli/migrate.ts"]
    env_file: .env
    depends_on: { postgres: { condition: service_healthy } }
  app:
    build: { context: .., dockerfile: Dockerfile }
    env_file: .env
    ports: ["3000:3000"]
    volumes: [appdata:/data]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    # Running jobs get SHUTDOWN_GRACE_MS (default 25 s) to finish on SIGTERM; keep this longer.
    stop_grace_period: 30s
  # Optional daily backup (§8.6): `docker compose --profile backup up -d`. Keeps 30 days in ./backups.
  # The master key is NOT in these backups — keep it separately.
  backup:
    profiles: [backup]
    image: pgvector/pgvector:pg16
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_platform}
      ARTIFACTS_DIR: /data/artifacts
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - appdata:/data:ro
      - ./backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do bash /usr/local/bin/backup.sh || echo 'backup failed'; sleep 86400; done"]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
volumes:
  pgdata: {}
  appdata: {}
